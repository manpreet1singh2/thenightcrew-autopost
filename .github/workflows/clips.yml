# Lambi video → AI short clips (Reels) → Facebook Pages par upload. Free GitHub Actions (CPU) par.
# Code: opensource-clipping (MIT) har run me pinned commit se download hota hai
# Secrets: GOOGLE_API_KEY (Gemini, free tier chalega), FB_USER_TOKEN ya FB_PAGE_TOKEN,
#          PEXELS_API_KEY (B-roll, optional), YT_COOKIES (optional: cookies.txt ka content, agar YouTube "bot" bole)
# Variables: CLIP_PAGES (khaali = main page, "all" = saare pages, ya naam/ID comma se),
#            CLIPS_PER_VIDEO (default 3), CLIP_INTERVAL_HOURS (default 4), CLIP_EXTRA_ARGS (main.py ke extra flags)
name: clips

on:
  schedule:
    - cron: "41 12 * * *"   # roz 6:11 PM IST: clip-queue.txt ka agla URL
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL (khaali = clip-queue.txt se agla)"
        required: false
      clips:
        description: "Kitne clips"
        default: "3"
      dry:
        description: "Sirf clips banao, upload mat karo"
        type: boolean
        default: true

permissions:
  contents: write          # clip-done.txt update karne ke liye

concurrency: clips

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Agla video chuno
        id: pick
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then
            URL=$(grep -vE '^\s*(#|$)' clip-queue.txt | while read -r u; do grep -qxF "$u" clip-done.txt || { echo "$u"; break; }; done)
          fi
          if [ -z "$URL" ]; then echo "Queue khaali hai — clip-queue.txt me URL daalo."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🎬 $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: opensource-clipping download (MIT, pinned commit)
        if: steps.pick.outputs.skip != '1'
        run: |
          git clone --filter=blob:none https://github.com/NaufalRizqullah/opensource-clipping.git clipper
          git -C clipper checkout a8fd4bc712855c3a5775448a1f62724419feaac3
          cp clipper-requirements.txt clipper/requirements-actions.txt

      - if: steps.pick.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - if: steps.pick.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clipper-requirements.txt

      - if: steps.pick.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - if: steps.pick.outputs.skip != '1'
        run: pip install -r clipper/requirements-actions.txt

      - name: Clips banao
        if: steps.pick.outputs.skip != '1'
        working-directory: clipper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          VIDEO_URL: ${{ steps.pick.outputs.url }}
        run: |
          EXTRA="${{ vars.CLIP_EXTRA_ARGS }}"
          [ -z "$PEXELS_API_KEY" ] && EXTRA="$EXTRA --no-broll"
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; EXTRA="$EXTRA --yt-cookies $RUNNER_TEMP/cookies.txt"; fi
          python main.py \
            --url "$VIDEO_URL" \
            --clips "${{ inputs.clips || vars.CLIPS_PER_VIDEO || '3' }}" \
            --ratio 9:16 \
            --whisper-model small --whisper-device cpu --whisper-compute-type int8 \
            --use-dlp-subs \
            --face-detector mediapipe \
            $EXTRA

      - if: steps.pick.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            clipper/outputs/**/*.mp4
            clipper/outputs/**/*.json
            clipper/outputs/**/*.jpg
          retention-days: 7

      - name: Facebook Pages par upload
        if: steps.pick.outputs.skip != '1'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '0' }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '628058697050691' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CLIP_PAGES: ${{ vars.CLIP_PAGES }}
          CLIP_INTERVAL_HOURS: ${{ vars.CLIP_INTERVAL_HOURS }}
        run: python scripts/clips_to_fb.py

      - name: Queue update
        if: steps.pick.outputs.skip != '1' && inputs.url == '' && !(github.event_name == 'workflow_dispatch' && inputs.dry)
        env:
          VIDEO_URL: ${{ steps.pick.outputs.url }}
        run: |
          echo "$VIDEO_URL" >> clip-done.txt
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add clip-done.txt && git commit -m "clips: done $VIDEO_URL" && git push
